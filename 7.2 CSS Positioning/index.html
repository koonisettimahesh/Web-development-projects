<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .blue-box {
      position : relative;
      left : 200px;
      top : 200px;
      background-color : red;
      height : 300px;
      width : 500px;
      /* border : 1px solid black; */
    }
    .red-circle {
      position : absolute;
      top : 150px;
      left : 250px;
      background-color : blue;
      height : 200px;
      width: 200px;
      border-radius : 100px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
